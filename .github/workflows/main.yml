name: Build MYZO External IPA

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      filza_url:
        description: "Direct URL to FilzaSlop_1.0.3.ipa (Optional if file exists in inputs/)"
        required: false
        default: ""
      app_version:
        description: "App Version String"
        required: false
        default: "1.0"
      app_build:
        description: "App Build Number"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA (macOS Runner)
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install lief pillow

      - name: Prepare Filza Sandbox IPA
        run: |
          mkdir -p inputs
          if [ -n "${{ github.event.inputs.filza_url }}" ]; then
            echo "Downloading FilzaSlop_1.0.3.ipa from ${{ github.event.inputs.filza_url }}..."
            curl -fL -o "inputs/FilzaSlop_1.0.3.ipa" "${{ github.event.inputs.filza_url }}"
          fi

          if [ ! -f "inputs/FilzaSlop_1.0.3.ipa" ]; then
            ANY_IPA=$(find . -maxdepth 3 -name "*Filza*.ipa" -o -name "*filza*.ipa" | head -n 1)
            if [ -n "$ANY_IPA" ]; then
              cp "$ANY_IPA" "inputs/FilzaSlop_1.0.3.ipa"
            else
              echo "::error::FilzaSlop_1.0.3.ipa not found in inputs/ folder!"
              exit 1
            fi
          fi

      - name: Compile and Package IPA
        env:
          APP_VERSION: ${{ github.event.inputs.app_version || '1.0' }}
          APP_BUILD: ${{ github.event.inputs.app_build || '1' }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobotExternal-v100-Offline-Unsigned
          path: |
            release/*.ipa
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}.{1}', github.event.inputs.app_version || '1.0', github.run_number) }}
          name: "MYZO External IPA Release v${{ github.event.inputs.app_version || '1.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.ipa
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
