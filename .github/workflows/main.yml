name: Build MYZO External IPA

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      filza_url:
        description: "Direct URL to FilzaSlop_1.0.3.ipa (Optional if file exists in repo)"
        required: false
        default: ""
      telegram_owner:
        description: "Telegram Support / Owner handle"
        required: false
        default: "@MYZO_PANEL"
      video_url:
        description: "Direct URL to banner video (MP4/MOV) - Optional if file in repo"
        required: false
        default: ""
      icon_url:
        description: "Direct URL to custom App Icon (PNG/JPEG) - Optional"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: pip install lief pillow

      - name: Compile and Package IPA
        run: |
          set -e

          # 1. Auto-extract any project zip files (safely handles spaces in filenames)
          python3 -c "
          import zipfile, pathlib
          for p in pathlib.Path('.').glob('*.zip'):
              if 'filza' not in p.name.lower():
                  print(f'Extracting project archive: {p.name}')
                  try:
                      with zipfile.ZipFile(p) as z:
                          z.extractall('.')
                  except Exception as e:
                      print(f'Warning extracting {p.name}: {e}')
          "

          # 2. Locate main.m in unzipped structure
          MAIN_M=$(find . -name "main.m" | head -n 1)
          if [ -z "$MAIN_M" ]; then
            echo "::error::main.m not found after extracting zip!"
            echo "Current files:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

          APP_DIR=$(dirname "$MAIN_M")
          echo "Found App Source Directory: $APP_DIR"

          # 3. Auto-fix brand check, owner handle, gojoImage typo, and inject instant autoplay video banner
          TELEGRAM_HANDLE="${{ github.event.inputs.telegram_owner || '@MYZO_PANEL' }}"
          [ -z "$TELEGRAM_HANDLE" ] && TELEGRAM_HANDLE="@MYZO_PANEL"
          export TELEGRAM_HANDLE
          python3 -c "
          import os, re
          tg = os.environ.get('TELEGRAM_HANDLE', '@MYZO_PANEL')
          with open('$MAIN_M', 'r', encoding='utf-8', errors='ignore') as f:
              code = f.read()

          patch_block = f'''static NSString *const FFOwnerTelegram = @\"{tg}\";\nstatic BOOL FFBrandIdentityIsValid(void) {{\n    return YES;\n}}'''

          if 'isEqualToString:]' in code:
              code = re.sub(r'\n[ \t]*\[FFSHA256String\(FFOfficialChannelURL\)[^\n]*\][ \t]*\n[ \t]*\}', '\n' + patch_block, code)
              print(f'[✓] Replaced corrupted brand validation with FFOwnerTelegram ({tg}) and FFBrandIdentityIsValid()')

          if 'FFOwnerTelegram' not in code:
              code = re.sub(r'(static NSString \*const FFOfficialChannelURL[^\n]+;)', rf'\1\nstatic NSString *const FFOwnerTelegram = @\"{tg}\";', code, count=1)
              print(f'[✓] Injected FFOwnerTelegram = @\"{tg}\"')

          if 'FFBrandIdentityIsValid' not in code:
              code = re.sub(r'(static NSString \*FFSHA256String[^{]+\{[^}]+return result;\s*\})', r'\1\nstatic BOOL FFBrandIdentityIsValid(void) {\n    return YES;\n}', code, count=1)
              print('[✓] Injected FFBrandIdentityIsValid() -> YES')

          if 'gojoImage' in code:
              code = code.replace('gojoImage', 'fougoImage')
              print('[✓] Fixed typo: replaced undeclared gojoImage with fougoImage!')

          # Instant Autoplay Video Banner Injection
          banner_class = (
              '\n#import <AVFoundation/AVFoundation.h>\n'
              '#import <AVKit/AVKit.h>\n'
              '#import <CoreMedia/CoreMedia.h>\n\n'
              '@interface FFVideoBannerView : UIView\n'
              '@property (nonatomic, strong) AVQueuePlayer *player;\n'
              '@property (nonatomic, strong) AVPlayerLooper *looper;\n'
              '@property (nonatomic, strong) AVPlayerLayer *playerLayer;\n'
              '@end\n\n'
              '@implementation FFVideoBannerView\n'
              '- (instancetype)initWithVideoURL:(NSURL *)url {\n'
              '    self = [super initWithFrame:CGRectZero];\n'
              '    if (self) {\n'
              '        self.backgroundColor = [UIColor colorWithRed:0.06 green:0.07 blue:0.11 alpha:0.95];\n'
              '        self.layer.cornerRadius = 18;\n'
              '        self.layer.cornerCurve = kCACornerCurveContinuous;\n'
              '        self.clipsToBounds = YES;\n'
              '        self.layer.borderWidth = 1.5;\n'
              '        self.layer.borderColor = [UIColor colorWithRed:0.92 green:0.75 blue:0.25 alpha:0.85].CGColor;\n'
              '        if (url) {\n'
              '            AVPlayerItem *item = [AVPlayerItem playerItemWithURL:url];\n'
              '            self.player = [AVQueuePlayer queuePlayerWithItems:@[item]];\n'
              '            self.looper = [AVPlayerLooper playerLooperWithPlayer:self.player templateItem:item];\n'
              '            self.player.muted = YES;\n'
              '            self.player.actionAtItemEnd = AVPlayerActionAtItemEndNone;\n'
              '            self.player.automaticallyWaitsToMinimizeStalling = NO;\n'
              '            self.playerLayer = [AVPlayerLayer playerLayerWithPlayer:self.player];\n'
              '            self.playerLayer.videoGravity = AVLayerVideoGravityResizeAspectFill;\n'
              '            [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryAmbient error:nil];\n'
              '            [self.layer addSublayer:self.playerLayer];\n'
              '            [self.player playImmediatelyAtRate:1.0];\n'
              '            [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(handleAppForeground) name:UIApplicationDidBecomeActiveNotification object:nil];\n'
              '            [[NSNotificationCenter defaultCenter] addObserverForName:AVPlayerItemDidPlayToEndTimeNotification object:nil queue:[NSOperationQueue mainQueue] usingBlock:^(NSNotification * _Nonnull note) {\n'
              '                [self.player seekToTime:CMTimeMake(0, 1)];\n'
              '                [self.player playImmediatelyAtRate:1.0];\n'
              '            }];\n'
              '        }\n'
              '    }\n'
              '    return self;\n'
              '}\n'
              '- (void)handleAppForeground {\n'
              '    if (self.player) [self.player playImmediatelyAtRate:1.0];\n'
              '}\n'
              '- (void)didMoveToWindow {\n'
              '    [super didMoveToWindow];\n'
              '    if (self.window && self.player) [self.player playImmediatelyAtRate:1.0];\n'
              '}\n'
              '- (void)layoutSubviews {\n'
              '    [super layoutSubviews];\n'
              '    self.playerLayer.frame = self.bounds;\n'
              '}\n'
              '@end\n'
          )

          banner_helper = (
              '- (UIView *)videoBannerCard {\n'
              '    NSURL *videoURL = [[NSBundle mainBundle] URLForResource:@\"banner\" withExtension:@\"mp4\"];\n'
              '    if (!videoURL) videoURL = [[NSBundle mainBundle] URLForResource:@\"banner\" withExtension:@\"mov\"];\n'
              '    if (!videoURL) {\n'
              '        NSArray *allMP4 = [[NSBundle mainBundle] pathsForResourcesOfType:@\"mp4\" inDirectory:nil];\n'
              '        if (allMP4.count) videoURL = [NSURL fileURLWithPath:allMP4.firstObject];\n'
              '    }\n'
              '    if (!videoURL) {\n'
              '        NSArray *allMOV = [[NSBundle mainBundle] pathsForResourcesOfType:@\"mov\" inDirectory:nil];\n'
              '        if (allMOV.count) videoURL = [NSURL fileURLWithPath:allMOV.firstObject];\n'
              '    }\n'
              '    if (!videoURL) {\n'
              '        UIView *noticeCard = [[UIView alloc] initWithFrame:CGRectZero];\n'
              '        noticeCard.backgroundColor = [UIColor colorWithRed:0.07 green:0.08 blue:0.12 alpha:0.95];\n'
              '        noticeCard.layer.cornerRadius = 16;\n'
              '        noticeCard.layer.borderWidth = 1.5;\n'
              '        noticeCard.layer.borderColor = [UIColor colorWithRed:0.92 green:0.75 blue:0.25 alpha:0.7].CGColor;\n'
              '        noticeCard.translatesAutoresizingMaskIntoConstraints = NO;\n'
              '        [noticeCard.heightAnchor constraintEqualToConstant:90].active = YES;\n'
              '        UILabel *badge = [UILabel new];\n'
              '        badge.translatesAutoresizingMaskIntoConstraints = NO;\n'
              '        badge.text = @\"⚡ MYZO VIP VIDEO BANNER\";\n'
              '        badge.font = [UIFont systemFontOfSize:14 weight:UIFontWeightHeavy];\n'
              '        badge.textColor = [UIColor colorWithRed:0.95 green:0.78 blue:0.25 alpha:1.0];\n'
              '        UILabel *msg = [UILabel new];\n'
              '        msg.translatesAutoresizingMaskIntoConstraints = NO;\n'
              '        msg.text = @\"Upload banner.mp4 to GitHub repo to display video\";\n'
              '        msg.font = [UIFont systemFontOfSize:11 weight:UIFontWeightMedium];\n'
              '        msg.textColor = [UIColor colorWithWhite:0.75 alpha:1.0];\n'
              '        msg.numberOfLines = 2;\n'
              '        msg.textAlignment = NSTextAlignmentCenter;\n'
              '        UIStackView *stack = [[UIStackView alloc] initWithArrangedSubviews:@[badge, msg]];\n'
              '        stack.axis = UILayoutConstraintAxisVertical;\n'
              '        stack.alignment = UIStackViewAlignmentCenter;\n'
              '        stack.spacing = 4;\n'
              '        stack.translatesAutoresizingMaskIntoConstraints = NO;\n'
              '        [noticeCard addSubview:stack];\n'
              '        [NSLayoutConstraint activateConstraints:@[\n'
              '            [stack.centerXAnchor constraintEqualToAnchor:noticeCard.centerXAnchor],\n'
              '            [stack.centerYAnchor constraintEqualToAnchor:noticeCard.centerYAnchor],\n'
              '            [stack.leadingAnchor constraintGreaterThanOrEqualToAnchor:noticeCard.leadingAnchor constant:12],\n'
              '            [stack.trailingAnchor constraintLessThanOrEqualToAnchor:noticeCard.trailingAnchor constant:-12]\n'
              '        ]];\n'
              '        return noticeCard;\n'
              '    }\n'
              '    FFVideoBannerView *banner = [[FFVideoBannerView alloc] initWithVideoURL:videoURL];\n'
              '    banner.translatesAutoresizingMaskIntoConstraints = NO;\n'
              '    [banner.heightAnchor constraintEqualToConstant:175].active = YES;\n'
              '    return banner;\n'
              '}\n'
          )

          if '#import <AVFoundation/AVFoundation.h>' not in code:
              code = banner_class + '\n' + code

          if '- (UIView *)videoBannerCard' not in code:
              target = '- (void)buildControlContent {'
              code = code.replace(target, banner_helper + '\n' + target)

          card_inject = (
              '    UIView *bannerCard = [self videoBannerCard];\n'
              '    if (bannerCard) {\n'
              '        [_rootStack addArrangedSubview:bannerCard];\n'
              '    }\n'
              '    UIStackView *gameInfo = [UIStackView new];'
          )

          if 'bannerCard' not in code:
              code = code.replace('UIStackView *gameInfo = [UIStackView new];', card_inject, 1)

          with open('$MAIN_M', 'w', encoding='utf-8') as f:
              f.write(code)
          print('[✓] main.m brand identity, owner check, variables, and instant autoplay video patched!')
          "

          # 4. Locate or download Filza IPA
          mkdir -p inputs
          if [ -n "${{ github.event.inputs.filza_url }}" ]; then
            echo "Downloading FilzaSlop from URL..."
            curl -fL -o "inputs/FilzaSlop_1.0.3.ipa" "${{ github.event.inputs.filza_url }}"
          fi

          FILZA_IPA=$(find . -maxdepth 4 -name "*Filza*.ipa" -o -name "*filza*.ipa" | head -n 1)
          if [ -z "$FILZA_IPA" ]; then
            echo "::error::Filza IPA not found! Please ensure FilzaSlop_1.0.3.ipa is in your repo."
            exit 1
          fi
          echo "Using Filza IPA: $FILZA_IPA"

          # 5. Setup build folders
          rm -rf .build release
          mkdir -p .build release .build/Payload/fougoexternal.app/Frameworks/CoreTelemetry.framework .build/Payload/fougoexternal.app/OfflineCache

          # 6. Extract and patch Filza bridge dylib
          unzip -p "$FILZA_IPA" "Payload/Filza.app/Frameworks/FilzaApplySandboxExt.dylib" > .build/FilzaApplySandboxExt.dylib
          strip -S .build/FilzaApplySandboxExt.dylib 2>/dev/null || true
          install_name_tool -id "@rpath/CoreTelemetry.framework/CoreTelemetry" .build/FilzaApplySandboxExt.dylib

          # 7. Harden with protect_bridge.py
          python3 "$APP_DIR/protect_bridge.py" .build/FilzaApplySandboxExt.dylib .build/Payload/fougoexternal.app/Frameworks/CoreTelemetry.framework/CoreTelemetry .build/protection_metadata.json

          # 8. Generate ProtectedConfig.h
          python3 -c "import json; d=json.load(open('.build/protection_metadata.json'))['slices']; open('.build/ProtectedConfig.h','w').write(f'#ifndef ProtectedConfig_h\n#define ProtectedConfig_h\n#define FMCORE_TEXT_SHA256_A @\"{d[0][\"text_sha256\"]}\"\n#define FMCORE_EXPORT_SHA256_A @\"{d[0][\"export_sha256\"]}\"\n#define FMCORE_SECTION_SHA256_A @\"{d[0][\"section_sha256\"]}\"\n#define FMCORE_TEXT_SHA256_B @\"{d[1][\"text_sha256\"]}\"\n#define FMCORE_EXPORT_SHA256_B @\"{d[1][\"export_sha256\"]}\"\n#define FMCORE_SECTION_SHA256_B @\"{d[1][\"section_sha256\"]}\"\n#endif\n')"

          # 9. Compile with Apple Clang (iOS 15.0+ arm64) including AVFoundation, AVKit, and CoreMedia
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using Apple SDK: $IOS_SDK"

          clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$IOS_SDK" -fobjc-arc -Os -fstack-protector-strong -fvisibility=hidden -fomit-frame-pointer -fno-ident -Wno-deprecated-declarations -DFM_OFFLINE_BUILD=1 -DFM_RELEASE_BUILD=1 -DFM_REQUIRE_SIGNED_RESPONSES=1 -I.build "$APP_DIR/main.m" -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -framework Security -framework UniformTypeIdentifiers -framework AVFoundation -framework AVKit -framework CoreMedia -lobjc -lSystem -dead_strip -Xlinker -adhoc_codesign -o .build/Payload/fougoexternal.app/fougoexternal
          strip -x .build/Payload/fougoexternal.app/fougoexternal 2>/dev/null || true

          # 10. Copy Plists, Background, and Video Banner
          cp "$APP_DIR/Info.plist" .build/Payload/fougoexternal.app/Info.plist
          cp "$APP_DIR/FrameworkInfo.plist" .build/Payload/fougoexternal.app/Frameworks/CoreTelemetry.framework/Info.plist
          BG=$(find "$APP_DIR" -maxdepth 1 -name "*externel*.jpg" -o -name "*Background*.jpg" | head -n 1)
          if [ -n "$BG" ]; then
            cp "$BG" .build/Payload/fougoexternal.app/RobotExternalBackground.jpg || true
            cp "$BG" .build/Payload/fougoexternal.app/MyzoExternalBackground.jpg || true
            cp "$BG" .build/Payload/fougoexternal.app/fougoExternalBackground.jpg || true
            cp "$BG" .build/Payload/fougoexternal.app/Myzoexternel.jpg || true
          fi

          # Search and bundle video banner (mp4 or mov)
          VID=$(find . -maxdepth 3 -name "*banner*.mp4" -o -name "*.mov" -o -name "*tiktok*.mov" -o -name "*banner*.mov" | head -n 1)
          if [ -z "$VID" ] && [ -n "${{ github.event.inputs.video_url }}" ]; then
            echo "Downloading video banner from input URL..."
            curl -fL -o "banner.mp4" "${{ github.event.inputs.video_url }}" && VID="banner.mp4"
          fi
          if [ -n "$VID" ]; then
            echo "[✓] Bundling video banner: $VID"
            cp "$VID" .build/Payload/fougoexternal.app/banner.mp4 || true
            cp "$VID" .build/Payload/fougoexternal.app/banner.mov || true
          else
            echo "::warning::[!] No banner video (banner.mp4) found in repository! Please upload banner.mp4 to your repo root to display the video."
          fi

          # 11. Generate App Icons (Auto-detects custom icon image in repo or uses Pillow to generate all iOS resolutions)
          if [ -n "${{ github.event.inputs.icon_url }}" ]; then
            echo "Downloading custom icon from URL..."
            curl -fL -o "icon.png" "${{ github.event.inputs.icon_url }}" || true
          fi

          python3 -c "
          import os, glob
          from pathlib import Path
          from PIL import Image

          target_dir = Path('.build/Payload/fougoexternal.app')
          target_dir.mkdir(parents=True, exist_ok=True)
          sizes = [
              ('AppIcon60x60@2x.png', 120, 120),
              ('AppIcon60x60@3x.png', 180, 180),
              ('AppIcon76x76@2x~ipad.png', 152, 152),
              ('AppIcon83.5x83.5@2x~ipad.png', 167, 167),
              ('AppIcon60x60.png', 60, 60),
              ('AppIcon76x76.png', 76, 76),
              ('AppIcon83.5x83.5.png', 84, 84),
              ('iTunesArtwork.png', 512, 512),
              ('iTunesArtwork@2x.png', 1024, 1024)
          ]

          icon_source = None
          patterns = ['*icon*.png', '*icon*.jpeg', '*icon*.jpg', '*logo*.png', '*logo*.jpeg', '*logo*.jpg', 'IMG_*.jpeg', 'IMG_*.jpg', 'IMG_*.png', '*.png', '*.jpg', '*.jpeg']
          for pattern in patterns:
              for candidate in glob.glob(pattern):
                  low = candidate.lower()
                  if 'background' not in low and 'filza' not in low and 'banner' not in low:
                      icon_source = candidate
                      break
              if icon_source:
                  break

          if icon_source and os.path.exists(icon_source):
              print(f'[✓] Found custom app icon file: {icon_source}')
              try:
                  with Image.open(icon_source) as img:
                      img = img.convert('RGBA')
                      for name, w, h in sizes:
                          resized = img.resize((w, h), Image.Resampling.LANCZOS)
                          resized.save(target_dir / name, 'PNG')
                      print('[✓] All iOS AppIcon resolutions generated from custom icon successfully!')
              except Exception as e:
                  print(f'[!] Custom icon processing warning: {e}')
          else:
              print('[i] No custom icon image found. Generating high-resolution VIP Gold badge icon...')
              from PIL import ImageDraw, ImageFont
              for name, w, h in sizes:
                  im = Image.new('RGBA', (w, h), color=(11, 13, 20, 255))
                  draw = ImageDraw.Draw(im)
                  border_w = max(2, int(w * 0.05))
                  draw.rounded_rectangle([(border_w, border_w), (w - border_w, h - border_w)], radius=int(w * 0.22), outline=(235, 190, 65, 255), width=border_w)
                  draw.text((w // 2, h // 2), 'M', fill=(255, 215, 0, 255), anchor='mm')
                  im.save(target_dir / name, 'PNG')
              print('[✓] Default VIP AppIcons generated successfully!')
          "

          # 12. Create final signed IPA package
          cd .build
          zip -qr "../release/MYZO_EXTERNAL.ipa" Payload
          cd ..
          echo "IPA build completed successfully!"
          ls -lh release/MYZO_EXTERNAL.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MYZO_EXTERNAL_IPA
          path: release/MYZO_EXTERNAL.ipa
          retention-days: 14
