name: Build MYZO External IPA

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      filza_url:
        description: "Direct URL to FilzaSlop_1.0.3.ipa (Optional if file exists in repo)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: pip install lief pillow

      - name: Compile and Package IPA
        run: |
          set -e
          MAIN_M=$(find . -name "main.m" | head -n 1)
          if [ -z "$MAIN_M" ]; then
            echo "Error: main.m not found!"
            exit 1
          fi
          APP_DIR=$(dirname "$MAIN_M")
          echo "Found APP_DIR: $APP_DIR"

          mkdir -p inputs
          if [ -n "${{ github.event.inputs.filza_url }}" ]; then
            curl -fL -o "inputs/FilzaSlop_1.0.3.ipa" "${{ github.event.inputs.filza_url }}"
          fi

          FILZA_IPA=$(find . -maxdepth 3 -name "*Filza*.ipa" -o -name "*filza*.ipa" | head -n 1)
          if [ -z "$FILZA_IPA" ]; then
            echo "Filza IPA not found! Please upload FilzaSlop_1.0.3.ipa in inputs/ or provide URL"
            exit 1
          fi
          echo "Using Filza IPA: $FILZA_IPA"

          rm -rf .build release
          mkdir -p .build release .build/Payload/fougoexternal.app/Frameworks/CoreTelemetry.framework .build/Payload/fougoexternal.app/OfflineCache

          unzip -p "$FILZA_IPA" "Payload/Filza.app/Frameworks/FilzaApplySandboxExt.dylib" > .build/FilzaApplySandboxExt.dylib
          strip -S .build/FilzaApplySandboxExt.dylib 2>/dev/null || true
          install_name_tool -id "@rpath/CoreTelemetry.framework/CoreTelemetry" .build/FilzaApplySandboxExt.dylib

          python3 "$APP_DIR/protect_bridge.py" .build/FilzaApplySandboxExt.dylib .build/Payload/fougoexternal.app/Frameworks/CoreTelemetry.framework/CoreTelemetry .build/protection_metadata.json

          python3 -c "import json; d=json.load(open('.build/protection_metadata.json'))['slices']; open('.build/ProtectedConfig.h','w').write(f'#ifndef ProtectedConfig_h\n#define ProtectedConfig_h\n#define FMCORE_TEXT_SHA256_A @\"{d[0][\"text_sha256\"]}\"\n#define FMCORE_EXPORT_SHA256_A @\"{d[0][\"export_sha256\"]}\"\n#define FMCORE_SECTION_SHA256_A @\"{d[0][\"section_sha256\"]}\"\n#define FMCORE_TEXT_SHA256_B @\"{d[1][\"text_sha256\"]}\"\n#define FMCORE_EXPORT_SHA256_B @\"{d[1][\"export_sha256\"]}\"\n#define FMCORE_SECTION_SHA256_B @\"{d[1][\"section_sha256\"]}\"\n#endif\n')"

          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$IOS_SDK" -fobjc-arc -Os -fstack-protector-strong -fvisibility=hidden -fomit-frame-pointer -fno-ident -Wno-deprecated-declarations -DFM_OFFLINE_BUILD=1 -DFM_RELEASE_BUILD=1 -DFM_REQUIRE_SIGNED_RESPONSES=1 -I.build "$APP_DIR/main.m" -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -framework Security -framework UniformTypeIdentifiers -lobjc -lSystem -dead_strip -Xlinker -adhoc_codesign -o .build/Payload/fougoexternal.app/fougoexternal
          strip -x .build/Payload/fougoexternal.app/fougoexternal 2>/dev/null || true

          cp "$APP_DIR/Info.plist" .build/Payload/fougoexternal.app/Info.plist
          cp "$APP_DIR/FrameworkInfo.plist" .build/Payload/fougoexternal.app/Frameworks/CoreTelemetry.framework/Info.plist
          BG=$(find "$APP_DIR" -maxdepth 1 -name "*externel*.jpg" -o -name "*Background*.jpg" | head -n 1)
          [ -n "$BG" ] && cp "$BG" .build/Payload/fougoexternal.app/RobotExternalBackground.jpg || true

          python3 -c "import zlib, struct, pathlib; p=pathlib.Path('.build/Payload/fougoexternal.app'); [p.joinpath(n).write_bytes(b'\x89PNG\r\n\x1a\n' + struct.pack('>IIBBBBB',w,h,8,6,0,0,0) + b'IHDR' + struct.pack('>I',zlib.crc32(b'IHDR'+struct.pack('>IIBBBBB',w,h,8,6,0,0,0))) + struct.pack('>I',len(zlib.compress(bytes([0 if x>0 else 0 for y in range(h) for x in range(w*4+1)])))) + b'IDAT' + zlib.compress(bytes([0 if x>0 else 0 for y in range(h) for x in range(w*4+1)])) + struct.pack('>I',zlib.crc32(b'IDAT'+zlib.compress(bytes([0 if x>0 else 0 for y in range(h) for x in range(w*4+1)])))) + struct.pack('>I',0) + b'IEND' + struct.pack('>I',zlib.crc32(b'IEND'))) for n,w,h in [('AppIcon60x60@2x.png',120,120),('AppIcon60x60@3x.png',180,180),('AppIcon76x76@2x~ipad.png',152,152),('AppIcon83.5x83.5@2x~ipad.png',167,167),('AppIcon60x60.png',60,60),('AppIcon76x76.png',76,76),('AppIcon83.5x83.5.png',84,84),('iTunesArtwork.png',512,512),('iTunesArtwork@2x.png',1024,1024)]]"

          for feat in BODY NECK; do
            PROF=$(find "$APP_DIR" -name "$feat.*" | head -n 1)
            if [ -n "$PROF" ]; then
              cp "$PROF" .build/Payload/fougoexternal.app/OfflineCache/$feat.fougoexternal
              cp "$PROF" .build/Payload/fougoexternal.app/$feat.fougoexternal
            fi
          done

          cd .build
          zip -qry9 "../release/RobotExternal-v100-Offline-Unsigned.ipa" Payload
          cd ..
          shasum -a 256 release/RobotExternal-v100-Offline-Unsigned.ipa > release/RobotExternal-v100-Offline-Unsigned.ipa.sha256
          echo "BUILD COMPLETED SUCCESSFULLY!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobotExternal-v100-Offline-Unsigned
          path: |
            release/*.ipa
            release/*.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "MYZO External IPA v1.0 (Build ${{ github.run_number }})"
          files: |
            release/*.ipa
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
