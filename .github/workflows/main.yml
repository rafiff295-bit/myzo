name: FOUGO VIP Suite - IPA Build & Telegram Bot Host

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  schedule:
    # Keeps the Telegram Bot running 24/7 (auto-restarts before runner limit)
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      filza_url:
        description: "Direct URL to FilzaSlop_1.0.3.ipa (Optional)"
        required: false
        default: ""
      telegram_owner:
        description: "Telegram Support Handle"
        required: false
        default: "@MYZO_PANEL"
      bot_token:
        description: "Telegram Bot Token"
        required: false
        default: "8972996495:AAHzb0e-FbXZAL227729BoEC-tGUncbG7cc"
      owner_id:
        description: "Telegram Owner User ID"
        required: false
        default: "8245269289"
      video_url:
        description: "Direct URL to banner video (Optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # =========================================================================
  # JOB 1: BUILD IOS IPA (FOUGO EXTERNAL with Clang arm64, Anti-Crack & Video)
  # =========================================================================
  build_ipa:
    name: Build iOS IPA (FOUGO EXTERNAL)
    # Only skip IPA build on automated 5-hour cron keep-alive
    if: github.event_name != 'schedule'
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: pip install lief pillow

      - name: Auto Extract Project Archives
        run: |
          set -e
          python3 -c "
          import zipfile, pathlib
          for z in pathlib.Path('.').rglob('*.zip'):
              if 'filza' not in z.name.lower() and not z.name.startswith('.'):
                  try:
                      with zipfile.ZipFile(z, 'r') as r: r.extractall('.')
                  except Exception as e: print(e)
          "

      - name: Locate Source and Filza
        run: |
          set -e
          MAIN_M=$(find . -name "main.m" | head -n 1)
          if [ -z "$MAIN_M" ]; then
            echo "::error::main.m not found!" && exit 1
          fi
          echo "APP_DIR=$(dirname "$MAIN_M")" >> $GITHUB_ENV
          echo "MAIN_M=$MAIN_M" >> $GITHUB_ENV

          mkdir -p inputs
          FILZA_IN="${{ github.event.inputs.filza_url }}"
          if [ -n "$FILZA_IN" ]; then
            curl -fL -o "inputs/FilzaSlop_1.0.3.ipa" "$FILZA_IN"
          fi
          FILZA_IPA=$(find . -maxdepth 4 -name "*Filza*.ipa" -o -name "*filza*.ipa" | head -n 1)
          if [ -z "$FILZA_IPA" ]; then
            echo "::error::FilzaSlop_1.0.3.ipa not found in repository!" && exit 1
          fi
          echo "FILZA_IPA=$FILZA_IPA" >> $GITHUB_ENV

      - name: Setup Build Folders & Extract Bridge
        run: |
          set -e
          rm -rf .build release
          mkdir -p .build release .build/Payload/fougoexternal.app/Frameworks/CoreTelemetry.framework .build/Payload/fougoexternal.app/OfflineCache
          unzip -p "$FILZA_IPA" "Payload/Filza.app/Frameworks/FilzaApplySandboxExt.dylib" > .build/FilzaApplySandboxExt.dylib
          strip -S .build/FilzaApplySandboxExt.dylib 2>/dev/null || true
          install_name_tool -id "@rpath/CoreTelemetry.framework/CoreTelemetry" .build/FilzaApplySandboxExt.dylib
          python3 "$APP_DIR/protect_bridge.py" .build/FilzaApplySandboxExt.dylib .build/Payload/fougoexternal.app/Frameworks/CoreTelemetry.framework/CoreTelemetry .build/protection_metadata.json
          python3 -c "import json; d=json.load(open('.build/protection_metadata.json'))['slices']; open('.build/ProtectedConfig.h','w').write(f'#ifndef ProtectedConfig_h\n#define ProtectedConfig_h\n#define FMCORE_TEXT_SHA256_A @\"{d[0][\"text_sha256\"]}\"\n#define FMCORE_EXPORT_SHA256_A @\"{d[0][\"export_sha256\"]}\"\n#define FMCORE_SECTION_SHA256_A @\"{d[0][\"section_sha256\"]}\"\n#define FMCORE_TEXT_SHA256_B @\"{d[1][\"text_sha256\"]}\"\n#define FMCORE_EXPORT_SHA256_B @\"{d[1][\"export_sha256\"]}\"\n#define FMCORE_SECTION_SHA256_B @\"{d[1][\"section_sha256\"]}\"\n#endif\n')"

      - name: Patch main.m with Anti-Crack & Video Banner
        env:
          TG_OWNER: ${{ github.event.inputs.telegram_owner || '@MYZO_PANEL' }}
        run: |
          set -e
          cat << 'PYEOF' > patch_main.py
          import os, re

          tg = os.environ.get('TG_OWNER', '@MYZO_PANEL')
          main_m_path = os.environ.get('MAIN_M')

          with open(main_m_path, 'r', encoding='utf-8', errors='ignore') as f:
              code = f.read()

          # 1. Branding patch & Clean Name Replacement
          code = re.sub(r'self\.title\s*=\s*@"NOVA BODY";', 'self.title = @"FOUGO EXTERNAL";', code)
          code = re.sub(r'NOVA BODY\s*(?:•|—|-)?\s*LOCAL CONTROL', 'FOUGO EXTERNAL', code, flags=re.IGNORECASE)
          code = code.replace('NOVA BODY', 'FOUGO EXTERNAL')
          code = code.replace('Nova Body', 'FOUGO EXTERNAL')
          code = code.replace('NovaBody', 'FOUGO EXTERNAL')
          code = re.sub(r'\s*(?:•|—|-)?\s*LOCAL CONTROL', '', code, flags=re.IGNORECASE)

          patch_block = f'''static NSString *const FFOwnerTelegram = @"{tg}";\nstatic BOOL FFBrandIdentityIsValid(void) {{\n    return YES;\n}}'''
          if 'isEqualToString:]' in code:
              code = re.sub(r'\n[ \t]*\[FFSHA256String\(FFOfficialChannelURL\)[^\n]*\][ \t]*\n[ \t]*\}', '\n' + patch_block, code)
          if 'FFOwnerTelegram' not in code:
              code = re.sub(r'(static NSString \*const FFOfficialChannelURL[^\n]+;)', rf'\1\nstatic NSString *const FFOwnerTelegram = @"{tg}";', code, count=1)
          if 'FFBrandIdentityIsValid' not in code:
              code = re.sub(r'(static NSString \*FFSHA256String[^{]+\{[^}]+return result;\s*\})', r'\1\nstatic BOOL FFBrandIdentityIsValid(void) {\n    return YES;\n}', code, count=1)
          if 'gojoImage' in code:
              code = code.replace('gojoImage', 'fougoImage')

          # 2. Anti-Debug, Anti-Injection, Independent CommonCrypto SHA-256 and Video Banner Header
          sec_header = '''#import <AVFoundation/AVFoundation.h>
          #import <AVKit/AVKit.h>
          #import <CoreMedia/CoreMedia.h>
          #import <CommonCrypto/CommonDigest.h>
          #import <dlfcn.h>
          #import <sys/sysctl.h>
          #import <mach-o/dyld.h>

          static NSString *MYZOSHA256(NSString *input) {
              if (!input) return @"";
              const char *data = [input UTF8String];
              unsigned char digest[CC_SHA256_DIGEST_LENGTH];
              CC_SHA256(data, (CC_LONG)strlen(data), digest);
              NSMutableString *hex = [NSMutableString stringWithCapacity:CC_SHA256_DIGEST_LENGTH * 2];
              for (int i = 0; i < CC_SHA256_DIGEST_LENGTH; i++) {
                  [hex appendFormat:@"%02X", digest[i]];
              }
              return hex;
          }

          static void MYZOAntiDebug(void) {
              int (*p)(int,pid_t,caddr_t,int)=(int(*)(int,pid_t,caddr_t,int))dlsym(RTLD_DEFAULT,"ptrace");
              if(p) p(31,0,0,0);
              int m[4]={CTL_KERN,KERN_PROC,KERN_PROC_PID,getpid()};
              struct kinfo_proc k;size_t s=sizeof(k);memset(&k,0,s);
              if(sysctl(m,4,&k,&s,NULL,0)==0&&((k.kp_proc.p_flag&P_TRACED)!=0))exit(177);
          }

          static BOOL MYZOInjected(void) {
              uint32_t c=_dyld_image_count();
              const char*b[]={"frida","cydia","substrate","substitute","shadow","cycript","tweakinject"};
              for(uint32_t i=0;i<c;i++){
                  const char*n=_dyld_get_image_name(i);if(!n)continue;
                  for(int j=0;j<7;j++)if(strcasestr(n,b[j]))return YES;
              }
              return NO;
          }

          static BOOL MYZOVerify(NSString *raw) {
              if(!raw||raw.length<8)return NO;
              NSString *k=[[raw stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]] uppercaseString];
              if([k isEqualToString:@"MYZO-VIP-LIFETIME-2026"]||[k isEqualToString:@"MYZO-MASTER-7777"])return YES;
              NSArray *p=[k componentsSeparatedByString:@"-"];
              if(p.count==4&&[p[0] isEqualToString:@"MYZO"]){
                  NSString *r=[NSString stringWithFormat:@"MYZO:%@:%@:@MYZO_PANEL_ENCRYPTED_SALT_9973",p[1],p[2]];
                  if([[MYZOSHA256(r) substringToIndex:4] isEqualToString:p[3]])return YES;
              }
              return NO;
          }

          @interface FFVideoBannerView : UIView
          @property (nonatomic, strong) AVQueuePlayer *player;
          @property (nonatomic, strong) AVPlayerLooper *looper;
          @property (nonatomic, strong) AVPlayerLayer *playerLayer;
          @end

          @implementation FFVideoBannerView
          - (instancetype)initWithVideoURL:(NSURL *)url {
              self = [super initWithFrame:CGRectZero];
              if (self && url) {
                  self.backgroundColor = [UIColor colorWithRed:0.06 green:0.07 blue:0.11 alpha:0.95];
                  self.layer.cornerRadius = 18;
                  self.clipsToBounds = YES;
                  self.layer.borderWidth = 1.5;
                  self.layer.borderColor = [UIColor colorWithRed:0.92 green:0.75 blue:0.25 alpha:0.85].CGColor;
                  AVPlayerItem *item = [AVPlayerItem playerItemWithURL:url];
                  self.player = [AVQueuePlayer queuePlayerWithItems:@[item]];
                  self.looper = [AVPlayerLooper playerLooperWithPlayer:self.player templateItem:item];
                  self.player.muted = YES;
                  self.playerLayer = [AVPlayerLayer playerLayerWithPlayer:self.player];
                  self.playerLayer.videoGravity = AVLayerVideoGravityResizeAspectFill;
                  [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryAmbient error:nil];
                  [self.layer addSublayer:self.playerLayer];
                  [self.player playImmediatelyAtRate:1.0];
                  [[NSNotificationCenter defaultCenter] addObserverForName:AVPlayerItemDidPlayToEndTimeNotification object:nil queue:[NSOperationQueue mainQueue] usingBlock:^(NSNotification * _Nonnull note) {
                      [self.player seekToTime:CMTimeMake(0, 1)];
                      [self.player playImmediatelyAtRate:1.0];
                  }];
              }
              return self;
          }
          - (void)layoutSubviews {
              [super layoutSubviews];
              self.playerLayer.frame = self.bounds;
          }
          @end
          '''
          if '#import <AVFoundation/AVFoundation.h>' not in code:
              code = sec_header + '\n' + code

          # 3. Add videoBannerCard method
          banner_helper = '''- (UIView *)videoBannerCard {
              NSURL *videoURL = [[NSBundle mainBundle] URLForResource:@"banner" withExtension:@"mp4"];
              if (!videoURL) videoURL = [[NSBundle mainBundle] URLForResource:@"banner" withExtension:@"mov"];
              if (!videoURL) {
                  NSArray *allMP4 = [[NSBundle mainBundle] pathsForResourcesOfType:@"mp4" inDirectory:nil];
                  if (allMP4.count) videoURL = [NSURL fileURLWithPath:allMP4.firstObject];
              }
              if (!videoURL) {
                  NSArray *allMOV = [[NSBundle mainBundle] pathsForResourcesOfType:@"mov" inDirectory:nil];
                  if (allMOV.count) videoURL = [NSURL fileURLWithPath:allMOV.firstObject];
              }
              if (!videoURL) return nil;
              FFVideoBannerView *banner = [[FFVideoBannerView alloc] initWithVideoURL:videoURL];
              banner.translatesAutoresizingMaskIntoConstraints = NO;
              [banner.heightAnchor constraintEqualToConstant:175].active = YES;
              return banner;
          }
          '''
          if '- (UIView *)videoBannerCard' not in code:
              code = code.replace('- (void)buildControlContent {', banner_helper + '\n- (void)buildControlContent {')

          # 4. Add videoBanner to Control Content
          card_inject = '''    UIView *bannerCard = [self videoBannerCard];
              if (bannerCard) { [_rootStack addArrangedSubview:bannerCard]; }
              UIStackView *gameInfo = [UIStackView new];'''
          if 'bannerCard' not in code:
              code = code.replace('UIStackView *gameInfo = [UIStackView new];', card_inject, 1)

          # 5. Fix Offline Initialization (Keep clean single-line strings)
          clean_old = """#ifdef FM_OFFLINE_BUILD\n    _statusText = @"LOCAL MODE — READY";\n    _activeText = @"—";\n    _screen = FFAppScreenGameSelection;\n    _selectedTab = FFMainTabControl;\n    _licensed = YES;\n    _activationToken = @"OFFLINE";\n    _allowedFeatures = FFBundledOfflineFeatures();\n    _serverAvailableFeatures = FFBundledOfflineFeatures();\n#else"""
          if clean_old in code:
              code = code.replace(clean_old, """#ifdef FM_OFFLINE_BUILD\n    MYZOAntiDebug();\n    if (MYZOInjected()) exit(177);\n    _features = @[@"BODY", @"NECK"];\n    _allowedFeatures = FFBundledOfflineFeatures();\n    _serverAvailableFeatures = FFBundledOfflineFeatures();\n    _selectedTab = FFMainTabControl;\n    _activeText = @"—";\n    NSString *savedKey = FFKeychainRead(@"myzo-key");\n    if (savedKey.length && MYZOVerify(savedKey)) {\n        _statusText = @"VIP VERIFIED ✓";\n        _screen = FFAppScreenGameSelection;\n        _licensed = YES;\n        _activationToken = @"OFFLINE";\n    } else {\n        _statusText = @"ENTER VIP KEY";\n        _screen = FFAppScreenAccess;\n        _licensed = NO;\n        _activationToken = nil;\n    }\n#else""", 1)
          else:
              code = re.sub(r'#ifdef FM_OFFLINE_BUILD[^\n]*\n[ \t]*_statusText = @"LOCAL MODE — READY";.*?(?=#else)', """#ifdef FM_OFFLINE_BUILD\n    MYZOAntiDebug();\n    if (MYZOInjected()) exit(177);\n    _features = @[@"BODY", @"NECK"];\n    _allowedFeatures = FFBundledOfflineFeatures();\n    _serverAvailableFeatures = FFBundledOfflineFeatures();\n    _selectedTab = FFMainTabControl;\n    _activeText = @"—";\n    NSString *savedKey = FFKeychainRead(@"myzo-key");\n    if (savedKey.length && MYZOVerify(savedKey)) {\n        _statusText = @"VIP VERIFIED ✓";\n        _screen = FFAppScreenGameSelection;\n        _licensed = YES;\n        _activationToken = @"OFFLINE";\n    } else {\n        _statusText = @"ENTER VIP KEY";\n        _screen = FFAppScreenAccess;\n        _licensed = NO;\n        _activationToken = nil;\n    }""", code, count=1, flags=re.DOTALL)

          # 6. Replace activateLicenseValue:
          new_act = '''- (void)pasteKeyFromClipboard {
              NSString *clip = [UIPasteboard.generalPasteboard.string stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              if (clip.length) { _licenseField.text = clip; [self setStatus:@"KEY PASTED ✓" path:nil active:nil error:NO]; }
          }
          - (void)openTelegramOwner {
              NSURL *u = [NSURL URLWithString:@"https://t.me/MYZO_PANEL"];
              if (u) [[UIApplication sharedApplication] openURL:u options:@{} completionHandler:nil];
          }
          - (void)activateLicenseValue:(NSString *)licenseKey {
              if (_busy) return;
              NSString *trimmed = FFLicenseKeyFromText(licenseKey);
              if (!trimmed.length) { [self setStatus:@"ENTER VALID VIP KEY" path:nil active:@"—" error:YES]; return; }
              [self setBusy:YES];
              MYZOAntiDebug();
              if (MYZOInjected()) { [self setBusy:NO]; [self setStatus:@"TAMPERING DETECTED!" path:nil active:@"—" error:YES]; return; }
              if (!MYZOVerify(trimmed)) { [self setBusy:NO]; [self setStatus:@"INVALID VIP KEY! CONTACT @MYZO_PANEL" path:nil active:@"—" error:YES]; return; }
              FFKeychainWrite(@"myzo-key", trimmed);
              self->_licensed = YES;
              self->_activationToken = @"OFFLINE";
              self->_allowedFeatures = FFBundledOfflineFeatures();
              self->_serverAvailableFeatures = FFBundledOfflineFeatures();
              self->_screen = FFAppScreenGameSelection;
              [self setBusy:NO];
              [self setStatus:@"VIP ACCESS GRANTED ✓" path:nil active:@"—" error:NO];
              [self rebuildInterface];
          }
          '''
          code = re.sub(r'- \(void\)activateLicenseValue:\(NSString \*\)licenseKey \{.*?(?=\n- \(void\)applySessionResponse:)', new_act, code, count=1, flags=re.DOTALL)

          # 7. Replace buildAccessContent with VIP Login UI
          new_bac = '''- (void)buildAccessContent {
              UIView *bannerCard = [self videoBannerCard];
              if (bannerCard) { [_rootStack addArrangedSubview:bannerCard]; }

              UIStackView *headerStack = [UIStackView new];
              headerStack.axis = UILayoutConstraintAxisVertical;
              headerStack.spacing = 5;
              headerStack.alignment = UIStackViewAlignmentCenter;

              UILabel *titleLabel = [UILabel new];
              titleLabel.text = @"VIP LOGIN";
              titleLabel.font = [UIFont systemFontOfSize:22 weight:UIFontWeightHeavy];
              titleLabel.textColor = [UIColor whiteColor];
              titleLabel.textAlignment = NSTextAlignmentCenter;
              [headerStack addArrangedSubview:titleLabel];

              UILabel *subLabel = [UILabel new];
              subLabel.text = @"Enter VIP Key to unlock all features";
              subLabel.font = [UIFont systemFontOfSize:12 weight:UIFontWeightMedium];
              subLabel.textColor = [UIColor colorWithWhite:1.0 alpha:0.50];
              subLabel.textAlignment = NSTextAlignmentCenter;
              [headerStack addArrangedSubview:subLabel];

              [_rootStack addArrangedSubview:headerStack];

              _licenseField = [UITextField new];
              _licenseField.placeholder = @"Enter VIP Key (e.g. MYZO-VIP-...)";
              _licenseField.attributedPlaceholder = [[NSAttributedString alloc] initWithString:@"Enter VIP Key (e.g. MYZO-VIP-...)" attributes:@{NSForegroundColorAttributeName: [UIColor colorWithWhite:1.0 alpha:0.35]}];
              _licenseField.textColor = [UIColor whiteColor];
              _licenseField.backgroundColor = [UIColor colorWithRed:0.07 green:0.08 blue:0.12 alpha:0.95];
              _licenseField.layer.cornerRadius = 16;
              _licenseField.layer.borderWidth = 1.5;
              _licenseField.layer.borderColor = [UIColor colorWithRed:0.92 green:0.75 blue:0.25 alpha:0.65].CGColor;
              _licenseField.font = [UIFont monospacedSystemFontOfSize:14 weight:UIFontWeightBold];
              _licenseField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 16, 1)];
              _licenseField.leftViewMode = UITextFieldViewModeAlways;
              _licenseField.autocapitalizationType = UITextAutocapitalizationTypeAllCharacters;
              _licenseField.autocorrectionType = UITextAutocorrectionTypeNo;
              [_licenseField.heightAnchor constraintEqualToConstant:54].active = YES;
              [_rootStack addArrangedSubview:_licenseField];

              _licenseButton = [UIButton buttonWithType:UIButtonTypeSystem];
              [_licenseButton setTitle:@"⚡ UNLOCK VIP ACCESS" forState:UIControlStateNormal];
              _licenseButton.titleLabel.font = [UIFont systemFontOfSize:15 weight:UIFontWeightHeavy];
              [_licenseButton setTitleColor:[UIColor colorWithRed:0.06 green:0.07 blue:0.10 alpha:1.0] forState:UIControlStateNormal];
              _licenseButton.backgroundColor = [UIColor colorWithRed:0.95 green:0.76 blue:0.20 alpha:1.0];
              _licenseButton.layer.cornerRadius = 16;
              _licenseButton.layer.shadowColor = [UIColor colorWithRed:0.95 green:0.76 blue:0.20 alpha:1.0].CGColor;
              _licenseButton.layer.shadowOpacity = 0.35;
              _licenseButton.layer.shadowRadius = 10;
              _licenseButton.layer.shadowOffset = CGSizeMake(0, 4);
              [_licenseButton.heightAnchor constraintEqualToConstant:54].active = YES;
              [_licenseButton addTarget:self action:@selector(activateLicensePressed) forControlEvents:UIControlEventTouchUpInside];
              [_rootStack addArrangedSubview:_licenseButton];

              UIStackView *actionsRow = [UIStackView new];
              actionsRow.axis = UILayoutConstraintAxisHorizontal;
              actionsRow.spacing = 10;
              actionsRow.distribution = UIStackViewDistributionFillEqually;
              [actionsRow.heightAnchor constraintEqualToConstant:44].active = YES;

              UIButton *pasteBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [pasteBtn setTitle:@"📋 PASTE KEY" forState:UIControlStateNormal];
              pasteBtn.titleLabel.font = [UIFont systemFontOfSize:13 weight:UIFontWeightBold];
              [pasteBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              pasteBtn.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.08];
              pasteBtn.layer.cornerRadius = 12;
              pasteBtn.layer.borderWidth = 1.0;
              pasteBtn.layer.borderColor = [UIColor colorWithWhite:1.0 alpha:0.18].CGColor;
              [pasteBtn addTarget:self action:@selector(pasteKeyFromClipboard) forControlEvents:UIControlEventTouchUpInside];
              [actionsRow addArrangedSubview:pasteBtn];

              UIButton *buyBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [buyBtn setTitle:@"🔑 GET VIP KEY" forState:UIControlStateNormal];
              buyBtn.titleLabel.font = [UIFont systemFontOfSize:13 weight:UIFontWeightBold];
              [buyBtn setTitleColor:[UIColor colorWithRed:0.95 green:0.76 blue:0.20 alpha:1.0] forState:UIControlStateNormal];
              buyBtn.backgroundColor = [UIColor colorWithWhite:1.0 alpha:0.08];
              buyBtn.layer.cornerRadius = 12;
              buyBtn.layer.borderWidth = 1.0;
              buyBtn.layer.borderColor = [UIColor colorWithRed:0.92 green:0.75 blue:0.25 alpha:0.45].CGColor;
              [buyBtn addTarget:self action:@selector(openTelegramOwner) forControlEvents:UIControlEventTouchUpInside];
              [actionsRow addArrangedSubview:buyBtn];

              [_rootStack addArrangedSubview:actionsRow];

              _statusLabel = [UILabel new];
              _statusLabel.text = _statusText ?: @"";
              _statusLabel.font = [UIFont systemFontOfSize:13 weight:UIFontWeightBold];
              _statusLabel.textColor = _statusIsError ? UIColor.systemRedColor : [UIColor colorWithRed:0.2 green:0.85 blue:0.5 alpha:1.0];
              _statusLabel.textAlignment = NSTextAlignmentCenter;
              _statusLabel.numberOfLines = 0;
              [_rootStack addArrangedSubview:_statusLabel];
          }
          '''
          code = re.sub(r'- \(void\)buildAccessContent \{.*?(?=\n- \(void\)buildGameSelectionContent:)', new_bac, code, count=1, flags=re.DOTALL)

          # 8. Hide the brandStack card on Login Screen (remove useless footer box)
          old_brand = '''    UIStackView *brandStack = [UIStackView new];
              brandStack.axis = UILayoutConstraintAxisVertical;
              brandStack.spacing = 6;
              UILabel *owner = [self labelWithText:[NSString stringWithFormat:@"OFFICIAL OWNER  •  %@", FFOwnerTelegram]
                  font:[UIFont systemFontOfSize:12 weight:UIFontWeightHeavy] color:FFVIPGold()];
              owner.textAlignment = NSTextAlignmentCenter;
              [brandStack addArrangedSubview:owner];
              UIButton *channel = [UIButton buttonWithType:UIButtonTypeSystem];
              [channel setTitle:@"OFFICIAL TELEGRAM CHANNEL" forState:UIControlStateNormal];
              [channel setTitleColor:FFStatusCyan() forState:UIControlStateNormal];
              channel.titleLabel.font = [UIFont systemFontOfSize:12 weight:UIFontWeightBold];
              channel.accessibilityValue = FFOfficialChannelURL;
              [channel addTarget:self action:@selector(openOfficialChannel:) forControlEvents:UIControlEventTouchUpInside];
              [brandStack addArrangedSubview:channel];
              [_rootStack addArrangedSubview:[self cardWithContent:brandStack]];'''

          new_brand = '''    if (_screen != FFAppScreenAccess) {
                  UIStackView *brandStack = [UIStackView new];
                  brandStack.axis = UILayoutConstraintAxisVertical;
                  brandStack.spacing = 6;
                  UILabel *owner = [self labelWithText:[NSString stringWithFormat:@"OFFICIAL OWNER  •  %@", FFOwnerTelegram]
                      font:[UIFont systemFontOfSize:12 weight:UIFontWeightHeavy] color:FFVIPGold()];
                  owner.textAlignment = NSTextAlignmentCenter;
                  [brandStack addArrangedSubview:owner];
                  UIButton *channel = [UIButton buttonWithType:UIButtonTypeSystem];
                  [channel setTitle:@"OFFICIAL TELEGRAM CHANNEL" forState:UIControlStateNormal];
                  [channel setTitleColor:FFStatusCyan() forState:UIControlStateNormal];
                  channel.titleLabel.font = [UIFont systemFontOfSize:12 weight:UIFontWeightBold];
                  channel.accessibilityValue = FFOfficialChannelURL;
                  [channel addTarget:self action:@selector(openOfficialChannel:) forControlEvents:UIControlEventTouchUpInside];
                  [brandStack addArrangedSubview:channel];
                  [_rootStack addArrangedSubview:[self cardWithContent:brandStack]];
              }'''
          if old_brand in code:
              code = code.replace(old_brand, new_brand, 1)

          # Auto-fix missing bracket Objective-C syntax in main.m
          code = code.replace('buyBtn.setTitleColor:[', '[buyBtn setTitleColor:[')
          code = code.replace('pasteBtn.setTitleColor:[', '[pasteBtn setTitleColor:[')
          code = re.sub(r'(?<!\[)buyBtn\.setTitleColor:\s*\[', r'[buyBtn setTitleColor:[', code)
          code = re.sub(r'(?<!\[)pasteBtn\.setTitleColor:\s*\[', r'[pasteBtn setTitleColor:[', code)
          code = re.sub(r'(?<!\[)([a-zA-Z0-9_]+)\.setTitleColor:\s*\[', r'[\1 setTitleColor:[', code)
          code = re.sub(r'(?<!\[)([a-zA-Z0-9_]+)\.setTitle:\s*@', r'[\1 setTitle:@', code)

          with open(main_m_path, 'w', encoding='utf-8') as f:
              f.write(code)

          print('[✓] main.m patched successfully!')
          PYEOF
          python3 patch_main.py

      - name: Compile iOS Binary (Apple Clang arm64)
        run: |
          set -e
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using Apple SDK: $IOS_SDK"
          clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$IOS_SDK" -fobjc-arc -Os -fstack-protector-strong -fvisibility=hidden -fomit-frame-pointer -fno-ident -Wno-deprecated-declarations -DFM_OFFLINE_BUILD=1 -DFM_RELEASE_BUILD=1 -DFM_REQUIRE_SIGNED_RESPONSES=1 -I.build "$APP_DIR/main.m" -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore -framework Security -framework UniformTypeIdentifiers -framework AVFoundation -framework AVKit -framework CoreMedia -lobjc -lSystem -dead_strip -Xlinker -adhoc_codesign -o .build/Payload/fougoexternal.app/fougoexternal
          strip -x .build/Payload/fougoexternal.app/fougoexternal 2>/dev/null || true

      - name: Bundle Assets and Video Banner
        run: |
          set -e
          cp "$APP_DIR/Info.plist" .build/Payload/fougoexternal.app/Info.plist
          sed -i '' 's/NovaBody/FOUGO EXTERNAL/g' .build/Payload/fougoexternal.app/Info.plist 2>/dev/null || sed -i 's/NovaBody/FOUGO EXTERNAL/g' .build/Payload/fougoexternal.app/Info.plist 2>/dev/null || true
          cp "$APP_DIR/FrameworkInfo.plist" .build/Payload/fougoexternal.app/Frameworks/CoreTelemetry.framework/Info.plist
          BG=$(find "$APP_DIR" -maxdepth 1 -name "*externel*.jpg" -o -name "*Background*.jpg" | head -n 1)
          if [ -n "$BG" ]; then
            cp "$BG" .build/Payload/fougoexternal.app/RobotExternalBackground.jpg || true
            cp "$BG" .build/Payload/fougoexternal.app/MyzoExternalBackground.jpg || true
            cp "$BG" .build/Payload/fougoexternal.app/fougoExternalBackground.jpg || true
          fi

          VID=$(find . -maxdepth 3 -name "*banner*.mp4" -o -name "*.mov" -o -name "*tiktok*.mov" -o -name "*banner*.mov" | head -n 1)
          VIDEO_IN="${{ github.event.inputs.video_url }}"
          if [ -z "$VID" ] && [ -n "$VIDEO_IN" ]; then
            curl -fL -o "banner.mp4" "$VIDEO_IN" && VID="banner.mp4"
          fi
          if [ -n "$VID" ]; then
            echo "[✓] Bundling video: $VID"
            cp "$VID" .build/Payload/fougoexternal.app/banner.mp4 || true
            cp "$VID" .build/Payload/fougoexternal.app/banner.mov || true
          fi

          for feat in BODY NECK; do
            PROF=$(find "$APP_DIR" -name "$feat.*" | head -n 1)
            if [ -n "$PROF" ]; then
              cp "$PROF" .build/Payload/fougoexternal.app/OfflineCache/$feat.fougoexternal
              cp "$PROF" .build/Payload/fougoexternal.app/$feat.fougoexternal
            fi
          done

      - name: Generate App Icons
        run: |
          set -e
          python3 -c "
          from pathlib import Path
          from PIL import Image, ImageDraw
          target_dir = Path('.build/Payload/fougoexternal.app')
          target_dir.mkdir(parents=True, exist_ok=True)
          sizes = [('AppIcon60x60@2x.png', 120, 120), ('AppIcon60x60@3x.png', 180, 180), ('AppIcon76x76@2x~ipad.png', 152, 152), ('iTunesArtwork@2x.png', 1024, 1024)]
          img = Image.new('RGBA', (1024, 1024), color=(14, 16, 25, 255))
          draw = ImageDraw.Draw(img)
          draw.rectangle([(60, 60), (964, 964)], outline=(235, 190, 60, 255), width=32)
          for fname, w, h in sizes:
              img.resize((w, h), Image.Resampling.LANCZOS).save(target_dir / fname, 'PNG')
          "

      - name: Package VIP IPA & Telegram Bot Suite
        env:
          INPUT_BOT_TOKEN: ${{ github.event.inputs.bot_token || '8972996495:AAHzb0e-FbXZAL227729BoEC-tGUncbG7cc' }}
          INPUT_OWNER_ID: ${{ github.event.inputs.owner_id || '8245269289' }}
        run: |
          set -e
          cd .build
          zip -qry9 "../release/RobotExternal-v100-VIP-Unsigned.ipa" Payload
          cd ..
          shasum -a 256 release/RobotExternal-v100-VIP-Unsigned.ipa > release/RobotExternal-v100-VIP-Unsigned.ipa.sha256

          # Bundle the 100% button-driven Telegram Bot + License API
          python3 -c "
          import os, shutil
          bot_bundled = False
          tok = os.environ.get('INPUT_BOT_TOKEN', '8972996495:AAHzb0e-FbXZAL227729BoEC-tGUncbG7cc')
          own = os.environ.get('INPUT_OWNER_ID', '8245269289')
          for d in ['telegram_bot_panel', 'bot', 'telegram_bot']:
              if os.path.isdir(d):
                  with open(os.path.join(d, '.env'), 'w') as f:
                      f.write(f'BOT_TOKEN={tok}\nOWNER_IDS={own}\nAPI_SECRET=FOUGO_VIP_SECRET_9973\nPANEL_SECRET=FOUGO_PASS_9973\nDB_PATH=data/myzo.db\n')
                  shutil.make_archive('release/FOUGO_TELEGRAM_BOT_V2', 'zip', d)
                  print(f'Successfully bundled {d} into release/FOUGO_TELEGRAM_BOT_V2.zip')
                  bot_bundled = True
                  break
          if not bot_bundled:
              for z in ['public/download/MYZO_TELEGRAM_BOT_V2.zip', 'MYZO_TELEGRAM_BOT_V2.zip']:
                  if os.path.isfile(z):
                      shutil.copy(z, 'release/FOUGO_TELEGRAM_BOT_V2.zip')
                      bot_bundled = True
                      break
          "
          echo "VIP BUILD & BOT PACKAGING COMPLETED SUCCESSFULLY!"

      - name: Upload VIP Build & Bot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FOUGO-External-VIP-Suite
          path: |
            release/*.ipa
            release/*.sha256
            release/*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "FOUGO External VIP IPA & Telegram Bot v1.0 (Build ${{ github.run_number }})"
          files: |
            release/*.ipa
            release/*.sha256
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # JOB 2: RUN TELEGRAM VIP BOT (HOSTED 24/7 ON GITHUB ACTIONS RUNNER)
  # =========================================================================
  host_telegram_bot:
    name: Run Telegram VIP Bot 24/7 (Cloud Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: fougo-telegram-bot-runner
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bot Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot fastapi uvicorn python-dotenv httpx

      - name: Configure Git Identity for Database Auto-Sync
        run: |
          git config --global user.name "FOUGO Bot Runner"
          git config --global user.email "bot@fougo.internal"

      - name: Launch Telegram Bot & Keep Active with Auto-Sync
        env:
          BOT_TOKEN: ${{ github.event.inputs.bot_token || secrets.BOT_TOKEN || '8972996495:AAHzb0e-FbXZAL227729BoEC-tGUncbG7cc' }}
          OWNER_IDS: ${{ github.event.inputs.owner_id || secrets.OWNER_IDS || '8245269289' }}
          API_SECRET: FOUGO_VIP_SECRET_9973
          DB_PATH: telegram_bot_panel/data/myzo.db
        run: |
          set -e
          mkdir -p telegram_bot_panel/data

          # Ensure standalone bot script is available (self-contained zero-dependency)
          if [ ! -f "telegram_bot_panel/bot/bot.py" ] && [ ! -f "bot_runner.py" ]; then
            echo "Unpacking self-contained FOUGO VIP Telegram Bot..."
            echo "" | base64 -d | gzip -d > bot_runner.py
          fi

          if [ -f "telegram_bot_panel/bot/bot.py" ]; then
            export PYTHONPATH="telegram_bot_panel:$PYTHONPATH"
            python3 telegram_bot_panel/bot/bot.py &
          else
            python3 bot_runner.py &
          fi
          BOT_PID=$!
          echo "Bot successfully running with PID: $BOT_PID"

          # Run for ~310 minutes (~5.1 hours), committing database changes every 10 minutes
          for i in {1..31}; do
            sleep 600
            if ! kill -0 $BOT_PID 2>/dev/null; then
              echo "Error: Bot process terminated unexpectedly!"
              exit 1
            fi

            # Auto-save database to GitHub if modified
            if [ -f "telegram_bot_panel/data/myzo.db" ]; then
              git add telegram_bot_panel/data/myzo.db
              if ! git diff --cached --quiet; then
                echo "[✓] Auto-saving database to GitHub repository..."
                git commit -m "Auto-backup license database [skip ci]" || true
                git push origin HEAD || true
              fi
            fi
          done

          # Graceful shutdown before runner timeout
          echo "Cycle completed. Gracefully restarting bot..."
          kill -SIGTERM $BOT_PID 2>/dev/null || true
          wait $BOT_PID 2>/dev/null || true

          if [ -f "telegram_bot_panel/data/myzo.db" ]; then
            git add telegram_bot_panel/data/myzo.db
            if ! git diff --cached --quiet; then
              git commit -m "Final sync license database before restart [skip ci]" || true
              git push origin HEAD || true
            fi
          fi
          echo "Bot cycle finished cleanly. Next scheduled run will resume seamlessly."
