name: Run Telegram VIP Bot 24-7

on:
  workflow_dispatch:
  schedule:
    # Auto-restarts every 5 hours for continuous 24/7 uptime
    - cron: '0 */5 * * *'
  push:
    branches: [ "main", "master" ]

concurrency:
  group: fougo-telegram-bot-instance
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-telegram-bot:
    name: Run Telegram VIP Bot on GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bot Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot fastapi uvicorn python-dotenv httpx

      - name: Configure Git Identity for Database Auto-Sync
        run: |
          git config --global user.name "GitHub Actions Bot Runner"
          git config --global user.email "actions@github.com"

      - name: Start Telegram Bot & Auto-Sync Database
        env:
          BOT_TOKEN: "8972996495:AAHzb0e-FbXZAL227729BoEC-tGUncbG7cc"
          OWNER_IDS: "8245269289"
          API_SECRET: FOUGO_VIP_SECRET_9973
          DB_PATH: telegram_bot_panel/data/myzo.db
        run: |
          set -e
          mkdir -p telegram_bot_panel/data

          # Unpack standalone bot script if folder not present
          if [ ! -f "telegram_bot_panel/bot/bot.py" ] && [ ! -f "bot_runner.py" ]; then
            echo "Unpacking self-contained FOUGO VIP Telegram Bot..."
            echo "" | base64 -d | gzip -d > bot_runner.py
          fi

          if [ -f "telegram_bot_panel/bot/bot.py" ]; then
            export PYTHONPATH="telegram_bot_panel:$PYTHONPATH"
            python3 telegram_bot_panel/bot/bot.py &
          else
            python3 bot_runner.py &
          fi
          BOT_PID=$!
          echo "Bot successfully running with PID: $BOT_PID"

          # Keep alive and auto-sync database
          for i in {1..31}; do
            sleep 600
            if ! kill -0 $BOT_PID 2>/dev/null; then
              echo "Error: Bot process terminated unexpectedly!"
              exit 1
            fi
            if [ -f "telegram_bot_panel/data/myzo.db" ]; then
              git add telegram_bot_panel/data/myzo.db
              if ! git diff --cached --quiet; then
                git commit -m "Auto-backup license database [skip ci]" || true
                git push origin HEAD || true
              fi
            fi
          done

          kill -SIGTERM $BOT_PID 2>/dev/null || true
          wait $BOT_PID 2>/dev/null || true
